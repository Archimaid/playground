<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archimaid Playground: write ArchiMate® diagrams as text in your browser</title>
    <meta
      name="description"
      content="Write ArchiMate® 3.2 diagrams as plain text and see them render as you type. Try the examples, share a link or download SVG and PNG. Free, open source, and nothing leaves your browser."
    />
    <link rel="canonical" href="https://try.archimaid.org/" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fbfaf6" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" href="/sitemap.xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Archimaid" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Archimaid Playground: write ArchiMate® diagrams as text in your browser" />
    <meta
      property="og:description"
      content="Write ArchiMate® 3.2 diagrams as plain text and see them render as you type. Free, open source, and nothing leaves your browser."
    />
    <meta property="og:url" content="https://try.archimaid.org/" />
    <meta property="og:image" content="https://try.archimaid.org/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Archimaid Playground: ArchiMate source in a dark editor next to the diagram it renders."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image:alt"
      content="Archimaid Playground: ArchiMate source in a dark editor next to the diagram it renders."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://try.archimaid.org/#webapp",
        "name": "Archimaid Playground",
        "url": "https://try.archimaid.org/",
        "description": "Write ArchiMate® 3.2 diagrams as plain text and see them render as you type, in your browser.",
        "image": "https://try.archimaid.org/og.png",
        "inLanguage": "en-GB",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "license": "https://spdx.org/licenses/MIT.html",
        "isPartOf": { "@id": "https://archimaid.org/#website" },
        "isBasedOn": { "@id": "https://archimaid.org/#software" },
        "sameAs": ["https://github.com/Archimaid/playground"]
      }
    </script>
  </head>
  <body>
    <h1 class="visually-hidden">Archimaid Playground: write ArchiMate® diagrams as text</h1>
    <noscript>
      <p class="noscript">
        The playground runs in your browser and needs JavaScript. Read about the syntax on
        <a href="https://archimaid.org">archimaid.org</a>.
      </p>
    </noscript>
    <header class="topbar">
      <a class="brand" href="https://archimaid.org">
        <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
          <rect x="34" y="14" width="74" height="26" rx="9" fill="var(--business)" />
          <rect x="23" y="47" width="74" height="26" rx="9" fill="var(--application)" />
          <rect x="12" y="80" width="74" height="26" rx="9" fill="var(--technology)" />
        </svg>
        <span class="brand-text">
          <span class="brand-name">Archimaid</span>
          <span class="brand-chip">Playground</span>
        </span>
      </a>
      <nav class="topbar-links" aria-label="Documentation">
        <a href="https://github.com/Archimaid/archimaid/blob/main/docs/reference.md">Reference</a>
        <a href="https://archimaid.org">archimaid.org</a>
      </nav>
      <label class="examples">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        <span class="visually-hidden">Load an example</span>
        <select id="examples"></select>
      </label>
      <a class="button github" href="https://github.com/Archimaid/archimaid" aria-label="Archimaid on GitHub">
        <svg class="icon icon-filled" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
          />
        </svg>
        <span class="button-label">GitHub</span>
      </a>
      <button id="share" class="button button-primary" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
          <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" />
        </svg>
        Share
      </button>
    </header>

    <div class="view-tabs" role="tablist" aria-label="View">
      <button id="tab-code" type="button" role="tab" aria-selected="true" aria-controls="code-pane">
        Code <span id="tab-code-badge" class="count-badge" hidden></span>
      </button>
      <button id="tab-diagram" type="button" role="tab" aria-selected="false" aria-controls="diagram-pane">
        Diagram
      </button>
    </div>

    <main id="workspace" class="workspace" data-view="code">
      <section id="code-pane" class="panel code-panel" aria-label="Source">
        <div class="panel-bar">
          <h2 class="file-tab"><span class="file-dot" aria-hidden="true"></span>diagram.mmd</h2>
          <div class="segmented segmented-dark notation" role="group" aria-label="Relationship notation">
            <button id="notation-long" type="button" aria-pressed="false">Long form</button>
            <button id="notation-shorthand" type="button" aria-pressed="false">Shorthand</button>
          </div>
          <span id="status-chip" class="status-chip" aria-live="polite"></span>
        </div>
        <div id="editor" class="editor"></div>
        <div id="problems" class="problems" hidden>
          <h3 class="problems-title">Problems <span id="problems-count" class="count-badge"></span></h3>
          <ul id="problems-list"></ul>
        </div>
        <footer class="status-bar">
          <span id="cursor-position"></span>
          <span id="model-summary"></span>
          <span id="storage-state" class="status-bar-end"></span>
        </footer>
      </section>

      <div
        id="divider"
        class="divider"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-label="Resize the source and diagram panels"
        aria-controls="code-pane"
        aria-valuemin="20"
        aria-valuemax="80"
      ></div>

      <section id="diagram-pane" class="panel diagram-panel" aria-label="Diagram">
        <div class="panel-bar diagram-toolbar">
          <h2 class="file-tab">
            <span class="file-dot file-dot-diagram" aria-hidden="true"></span><span id="diagram-title">Diagram</span>
          </h2>
          <div class="button-group" role="group" aria-label="Zoom">
            <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
            <button id="zoom-reset" class="zoom-level" type="button" aria-label="Zoom to 100%">100%</button>
            <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          </div>
          <button id="zoom-fit" class="chip-button fit" type="button" aria-pressed="true">Fit</button>
          <div class="segmented theme-switch" role="group" aria-label="Diagram theme">
            <button id="theme-light" type="button" aria-pressed="true">Light</button>
            <button id="theme-dark" type="button" aria-pressed="false">Dark</button>
          </div>
          <button id="theme-toggle" class="chip-button icon-button theme-toggle" type="button" aria-pressed="false">
            <span class="visually-hidden">Dark diagram</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <div id="download-control" class="download">
            <button
              id="download"
              class="chip-button download-button"
              type="button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="download-menu"
              disabled
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v12" />
                <path d="m7 10 5 5 5-5" />
                <path d="M5 21h14" />
              </svg>
              <span class="download-label">Download</span>
              <svg class="icon icon-small download-chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div id="download-menu" class="download-menu" role="dialog" aria-label="Download diagram" hidden>
              <fieldset>
                <legend>Background</legend>
                <label
                  ><input type="radio" name="download-background" value="diagram" checked /> Diagram background</label
                >
                <label><input type="radio" name="download-background" value="transparent" /> Transparent</label>
              </fieldset>
              <div class="download-actions">
                <button id="download-svg" class="button" type="button">SVG</button>
                <button id="download-png" class="button button-primary" type="button">PNG</button>
              </div>
              <p class="download-hint">SVG stays sharp at any size. PNG is 2× for slides and documents.</p>
            </div>
          </div>
        </div>
        <p id="preview-state" class="preview-state" aria-live="polite">
          <span class="preview-state-dot" aria-hidden="true"></span
          ><span id="preview-state-text">Loading the renderer…</span>
        </p>
        <div id="preview" class="preview"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
