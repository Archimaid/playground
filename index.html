<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archimaid Playground</title>
    <meta
      name="description"
      content="Write ArchiMate® diagrams as text and see them render as you type. Runs entirely in your browser."
    />
    <meta name="theme-color" content="#fbfaf6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://archimaid.org">
        <svg width="26" height="26" viewBox="0 0 120 120" aria-hidden="true">
          <rect
            x="34"
            y="14"
            width="74"
            height="26"
            rx="9"
            stroke-width="8"
            fill="var(--business)"
            stroke="var(--ink)"
          />
          <rect
            x="23"
            y="47"
            width="74"
            height="26"
            rx="9"
            stroke-width="8"
            fill="var(--application)"
            stroke="var(--ink)"
          />
          <rect
            x="12"
            y="80"
            width="74"
            height="26"
            rx="9"
            stroke-width="8"
            fill="var(--technology)"
            stroke="var(--ink)"
          />
        </svg>
        <span class="brand-name">Archimaid</span>
        <span class="brand-suffix">Playground</span>
      </a>
      <label class="examples">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        <span class="visually-hidden">Load an example</span>
        <select id="examples"></select>
      </label>
      <div class="topbar-spacer"></div>
      <nav class="topbar-links" aria-label="Documentation">
        <a href="https://github.com/Archimaid/archimaid/blob/main/docs/reference.md">Syntax reference</a>
        <a href="https://github.com/Archimaid/archimaid">GitHub</a>
      </nav>
      <button id="share" class="button button-primary" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
          <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" />
        </svg>
        Share
      </button>
    </header>

    <div class="view-tabs" role="tablist" aria-label="View">
      <button id="tab-code" type="button" role="tab" aria-selected="true" aria-controls="code-pane">
        Code <span id="tab-code-badge" class="count-badge" hidden></span>
      </button>
      <button id="tab-diagram" type="button" role="tab" aria-selected="false" aria-controls="diagram-pane">
        Diagram
      </button>
    </div>

    <main id="workspace" class="workspace" data-view="code">
      <section id="code-pane" class="pane code-pane" aria-label="Source">
        <div class="pane-header">
          <h2 class="pane-title">Source</h2>
          <div class="segmented notation" role="group" aria-label="Relationship notation">
            <button id="notation-long" type="button" aria-pressed="false">Long form</button>
            <button id="notation-shorthand" type="button" aria-pressed="false">Shorthand</button>
          </div>
          <span id="status-chip" class="status-chip" aria-live="polite"></span>
        </div>
        <div id="editor" class="editor"></div>
        <div id="problems" class="problems" hidden>
          <h3 class="problems-title">Problems <span id="problems-count" class="count-badge"></span></h3>
          <ul id="problems-list"></ul>
        </div>
        <footer class="status-bar">
          <span id="cursor-position"></span>
          <span id="model-summary"></span>
          <span id="storage-state" class="status-bar-end"></span>
        </footer>
      </section>

      <div
        id="divider"
        class="divider"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-label="Resize the source and diagram panes"
        aria-controls="code-pane"
        aria-valuemin="20"
        aria-valuemax="80"
      ></div>

      <section id="diagram-pane" class="pane diagram-pane" aria-label="Diagram">
        <div class="pane-header diagram-toolbar">
          <h2 class="pane-title">Diagram</h2>
          <div class="toolbar-spacer"></div>
          <div class="button-group" role="group" aria-label="Zoom">
            <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
            <button id="zoom-reset" class="zoom-level" type="button" aria-label="Zoom to 100%">100%</button>
            <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          </div>
          <button id="zoom-fit" class="button" type="button" aria-pressed="true">Fit</button>
          <div class="segmented" role="group" aria-label="Diagram theme">
            <button id="theme-light" type="button" aria-pressed="true">Light</button>
            <button id="theme-dark" type="button" aria-pressed="false">Dark</button>
          </div>
          <button id="download" class="button" type="button" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12" />
              <path d="m7 10 5 5 5-5" />
              <path d="M5 21h14" />
            </svg>
            <span>SVG</span>
          </button>
        </div>
        <div class="canvas">
          <div id="preview" class="preview"></div>
          <p id="preview-state" class="preview-state" aria-live="polite">
            <span class="preview-state-dot" aria-hidden="true"></span
            ><span id="preview-state-text">Loading the renderer…</span>
          </p>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
