version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # A new archimaid release changes the renderer and the examples, so it gets its own pull request.
      development:
        dependency-type: development
        update-types: [minor, patch]
      editor:
        patterns: ['@codemirror/*', '@lezer/*', 'codemirror']
        update-types: [minor, patch]
    ignore:
      # The types must match the oldest supported Node.js release, not the newest.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
